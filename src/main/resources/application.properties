spring.application.name=seguratuauto
# Configuración de Base de Datos MySQL
# Configuración principal para producción
spring.datasource.url=jdbc:mysql://localhost:3306/segura_tu_auto
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración de correo (MailDev)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Propiedades personalizadas
app.frontend-url=http://localhost:5173
app.verification.base-url=http://localhost:8080/api/verificacion/confirmar
app.verification.expiration-hours=24
app.password-reset.expiration-hours=2

# Configuración de Archivos Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=1KB

# Configuración personalizada para documentos adjuntos
app.file.upload-dir=uploads
app.file.max-file-size=10485760
app.file.max-files-per-reclamacion=5
